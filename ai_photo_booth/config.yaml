name: "AI Photo Booth"
description: "Receives camera snapshots, transforms them to medieval style via OpenAI, uploads to Cloudflare R2, and pushes QR code back to Home Assistant."
version: "0.3.0"
slug: ai-photo-booth
url: "https://github.com/ajfriesen/ha-apps"
arch:
  - aarch64
  - amd64
init: false

homeassistant_api: true
ingress: true
ingress_port: 8585
# Sidebar entry for the ingress panel. panel_icon is an MDI NAME, not a file -
# icon.png/logo.png are the add-on store artwork and have nothing to do with
# the sidebar. Without this it falls back to the generic mdi:puzzle.
panel_icon: mdi:camera-iris
panel_title: "Fotobox"

map:
  - media:rw

# No ports: mapping on purpose. The dashboard has no authentication of its own,
# and as of 0.2.0 it can edit the guest page HTML, so anything that can reach
# POST /settings can put arbitrary JavaScript on pages served from the public
# photo domain to every guest who scans a QR code. Ingress is authenticated by
# Home Assistant, so that is the only way in.
#
# Home Assistant Core still reaches the add-on over the Supervisor's internal
# network, which needs no host port. The rest_command must use the add-on's
# hostname - its slug with underscores turned into dashes - NOT the host name:
#
#   http://49e94de4-ai-photo-booth:8585/process_local
#
# Note that is the PROD hostname, without the -dev suffix. The 49e94de4 prefix
# is this repository's id and differs per install.

image: "ajfriesen/ai-photo-booth"

options:
  openai_api_key: ""
  r2_access_key_id: ""
  r2_secret_access_key: ""
  r2_endpoint: ""
  r2_bucket_name: "ai-photobooth"
  r2_public_url: "https://photos.yourdomain.com"
  ha_page_entity: "input_text.photobooth_page_url"
  ha_image_entity: "input_text.photobooth_image_url"
  ha_next_entity: "input_text.photobooth_next_url"
  media_folder: "/media/canon_photos"
  license_key: ""
  log_level: "info"

# password instead of str masks these in the Supervisor UI. DISPLAY masking
# only: the values still sit in plain text in the add-on options store and are
# readable through the Supervisor API. It stops shoulder-surfing and
# screenshots, not someone with host access.
#
# r2_endpoint and r2_access_key_id stay str on purpose - an endpoint URL is not
# a credential, and an access key id is the public half of the pair. Masking
# them would only make a wrong-key mismatch harder to spot.
#
# NOTE: this file is the manifest Home Assistant actually reads. The source
# repo ai-photo-booth has its own config.yaml and CI only sed's the version
# line into this one, so schema changes must be made HERE too.
#
# What that costs when it is forgotten, twice over. Until 0.2.0 this file still
# offered skip_ai, image_model, image_size, image_quality, output_format,
# output_compression and image_prompt. Those moved into the add-on's own
# settings UI in 0.1.x, so anything typed into them here was read into the
# config and then immediately overwritten by the stored runtime settings - a row
# of knobs in the Supervisor UI that looked authoritative and did nothing.
#
# The reverse also happened: the build shipped ha_image_entity and
# ha_next_entity, this file did not, so the Supervisor never wrote them to
# options.json and both features silently did nothing. The add-on now falls back
# to built-in defaults for missing keys and logs a warning naming them, so that
# direction degrades loudly. Listing a key here is still what makes it editable
# in the Supervisor UI.
#
# Removing a key is safe for existing installs: Supervisor ignores stored
# options that are no longer in the schema and logs a warning
# (supervisor/apps/options.py, "does not exist in the schema").
schema:
  openai_api_key: password
  r2_access_key_id: str
  r2_secret_access_key: password
  r2_endpoint: str
  r2_bucket_name: str
  r2_public_url: str
  ha_page_entity: str
  ha_image_entity: str
  ha_next_entity: str
  media_folder: str
  license_key: password
  log_level: "list(info|debug)"
