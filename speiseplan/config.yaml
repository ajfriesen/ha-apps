name: "SpeisePlan"
description: "Weekly meal planner — plan dinners, collect recipes, snap photos of what you cooked."
version: "1.1.0"
slug: speiseplan
url: "https://github.com/ajfriesen/SpeisePlan"
arch:
  - aarch64
  - amd64

# Belt-and-suspenders: image ENV + entrypoint also disable self-update.
environment:
  SPEISEPLAN_UPDATE: "off"

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web UI"

webui: "http://[HOST]:[PORT:8080]"

image: "ghcr.io/ajfriesen/speiseplan"

options:
  password: ""
  # Token for the read-only JSON API the Home Assistant integration uses.
  # Leave blank and SpeisePlan generates one on first start; either way the
  # current value is shown on its Settings page.
  api_token: ""
  timezone: ""

schema:
  password: "password?"
  api_token: "password?"
  timezone: "str?"
