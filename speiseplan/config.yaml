name: "SpeisePlan"
description: "Weekly meal planner — plan dinners, collect recipes, snap photos of what you cooked."
version: "2.1.0"
slug: speiseplan
url: "https://github.com/ajfriesen/SpeisePlan"
arch:
  - aarch64
  - amd64

# Belt-and-suspenders: image ENV + entrypoint also disable self-update.
environment:
  SPEISEPLAN_UPDATE: "off"

ingress: true
ingress_port: 8080
panel_icon: mdi:silverware-fork-knife
panel_title: "SpeisePlan"

# Ingress is the everyday front door and Home Assistant authenticates it. The
# host port exists for one job: a phone scanning the QR code that a display
# shows in place of a missing recipe photo. Ingress URLs carry a per-session
# token, so they cannot be printed into a QR code — only a direct address can.
#
# SpeisePlan has no login of its own, so anything that reaches this port has
# full access to the plan and the JSON API. That is the trade for the scan.
# Put a reverse proxy in front and add basic auth there if the LAN is not
# trusted, then point public_url at the proxy.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Direct access, for QR code scans"

image: "ghcr.io/ajfriesen/speiseplan"

options:
  # Where a phone can reach SpeisePlan — this is what the QR code encodes, so
  # it must be resolvable from the phone, not from Home Assistant. Leave it
  # blank and recipes without a photo simply have no image to serve.
  public_url: ""
  timezone: ""

schema:
  public_url: "url?"
  timezone: "str?"
