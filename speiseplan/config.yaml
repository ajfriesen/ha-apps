name: "SpeisePlan"
description: "Weekly meal planner — plan dinners, collect recipes, snap photos of what you cooked."
version: "2.0.0"
slug: speiseplan
url: "https://github.com/ajfriesen/SpeisePlan"
arch:
  - aarch64
  - amd64

# Belt-and-suspenders: image ENV + entrypoint also disable self-update.
environment:
  SPEISEPLAN_UPDATE: "off"

ingress: true
ingress_port: 8080
panel_icon: mdi:silverware-fork-knife
panel_title: "SpeisePlan"

# No ports: mapping on purpose. As of 2.0.0 SpeisePlan has no login of its own —
# ingress is the front door, and Home Assistant authenticates that. Publishing
# 8080 on the LAN would hand anyone on the network full access, including the
# read-only JSON API, which no longer takes a token either. If you want it
# reachable outside Home Assistant, put a reverse proxy in front and add the
# password there.
#
# Home Assistant Core still reaches the add-on over the Supervisor's internal
# network, which needs no host port. The SpeisePlan integration must therefore
# use the add-on's hostname — its slug with underscores turned into dashes —
# NOT your Home Assistant host:
#
#   http://49e94de4-speiseplan:8080
#
# The 49e94de4 prefix is this repository's id and differs per install; the
# add-on's own log prints it at startup. The integration still asks for a token:
# type anything, it is ignored.

image: "ghcr.io/ajfriesen/speiseplan"

options:
  timezone: ""

schema:
  timezone: "str?"
